name: Bootstrap v0.1.0 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The only supported bootstrap version"
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate bootstrap request
        env:
          REF_NAME: ${{ github.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_NAME" != 'refs/heads/main' ]; then
            echo 'Bootstrap must run from main' >&2
            exit 1
          fi
          if [ "$VERSION" != '0.1.0' ]; then
            echo 'Only version 0.1.0 is supported' >&2
            exit 1
          fi
          echo 'Bootstrap version is 0.1.0'

  publish:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            runtime: win-x64
          - os: ubuntu-24.04
            runtime: linux-x64
          - os: macos-15
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Publish and package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          ./scripts/publish.ps1 -Runtime $env:RUNTIME -Version 0.1.0
          ./scripts/package-release.ps1 -Runtime $env:RUNTIME -Version 0.1.0
      - name: Publish and package on POSIX
        if: runner.os != 'Windows'
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          bash scripts/publish.sh --version 0.1.0 "$RUNTIME"
          bash scripts/package-release.sh --version 0.1.0 "$RUNTIME"
      - name: Smoke test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke.ps1 -PublishDirectory "artifacts/publish/${{ matrix.runtime }}"
      - name: Smoke test on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/smoke.sh "artifacts/publish/${{ matrix.runtime }}"
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-${{ matrix.runtime }}
          path: artifacts/release/*
          if-no-files-found: error

  release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bootstrap-*
          path: artifacts/release
          merge-multiple: true
      - name: Assemble release
        shell: bash
        run: |
          cp scripts/install.ps1 artifacts/release/install.ps1
          cp scripts/install.sh artifacts/release/install.sh
          cd artifacts/release
          sha256sum token-dashboard-* install.ps1 install.sh > SHA256SUMS
      - name: Create v0.1.0 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.0 \
            --target "${{ github.sha }}" \
            --title 'Token Dashboard v0.1.0' \
            --notes 'Initial self-contained release' \
            artifacts/release/*
