name: Bootstrap v0.1.0 Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The only supported bootstrap version'
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate bootstrap request
        env:
          REF_NAME: ${{ github.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_NAME" != 'refs/heads/main' ]; then
            echo 'Bootstrap must run from main' >&2
            exit 1
          fi
          if [ "$VERSION" != '0.1.0' ]; then
            echo 'Only version 0.1.0 is supported' >&2
            exit 1
          fi
          echo 'Bootstrap version is 0.1.0'

  publish:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            runtime: win-x64
          - os: ubuntu-24.04
            runtime: linux-x64
          - os: macos-15-intel
            runtime: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - name: Setup .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5b # v4.3.1
        with:
          global-json-file: global.json
      - name: Publish and package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          ./scripts/publish.ps1 -Runtime $env:RUNTIME -Version 0.1.0
          ./scripts/package-release.ps1 -Runtime $env:RUNTIME -Version 0.1.0
      - name: Publish and package on POSIX
        if: runner.os != 'Windows'
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: |
          bash scripts/publish.sh --version 0.1.0 "$RUNTIME"
          bash scripts/package-release.sh --version 0.1.0 "$RUNTIME"
      - name: Smoke test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke.ps1 -PublishDirectory "artifacts/publish/${{ matrix.runtime }}"
      - name: Smoke test on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/smoke.sh "artifacts/publish/${{ matrix.runtime }}"
      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bootstrap-${{ matrix.runtime }}
          path: artifacts/release/*
          if-no-files-found: error

  release:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bootstrap-*
          path: artifacts/release
          merge-multiple: true
      - name: Assemble release
        shell: bash
        run: |
          cp scripts/install.ps1 artifacts/release/install.ps1
          cp scripts/install.sh artifacts/release/install.sh
          cd artifacts/release
          sha256sum token-dashboard-* install.ps1 install.sh > SHA256SUMS
      - name: Create v0.1.0 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.0 \
            --target "${{ github.sha }}" \
            --title 'Token Dashboard v0.1.0' \
            --notes 'Initial self-contained release' \
            artifacts/release/*
