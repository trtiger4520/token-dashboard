name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm --filter token-dashboard-web build
      - name: Setup .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5b # v4.3.1
        with:
          global-json-file: global.json
      - name: Restore .NET
        run: dotnet restore TokenDashboard.slnx
      - name: Build .NET
        run: dotnet build TokenDashboard.slnx --no-restore
      - name: Test .NET
        run: dotnet test TokenDashboard.slnx --no-restore

  installer-help:
    strategy:
      matrix:
        include:
          - os: windows-2025
            shell: pwsh
            command: ./scripts/install.ps1 -Help
          - os: ubuntu-24.04
            shell: bash
            command: bash scripts/install.sh --help
          - os: macos-15-intel
            shell: bash
            command: bash scripts/install.sh --help
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate installer command line
        shell: ${{ matrix.shell }}
        run: ${{ matrix.command }}
