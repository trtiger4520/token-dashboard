name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm --filter token-dashboard-web build
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore .NET
        run: dotnet restore TokenDashboard.slnx
      - name: Build .NET
        run: dotnet build TokenDashboard.slnx --no-restore
      - name: Test .NET
        run: dotnet test TokenDashboard.slnx --no-restore

  resolve:
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      hasRelease: ${{ steps.release.outputs.hasRelease }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - name: Install release dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve next release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: pnpm release:resolve >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    if: needs.resolve.outputs.hasRelease == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            runtime: win-x64
          - os: ubuntu-24.04
            runtime: linux-x64
          - os: macos-15
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v4.3.1
        with:
          global-json-file: global.json
      - name: Publish and package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          ./scripts/publish.ps1 -Runtime $env:RUNTIME -Version $env:VERSION
          ./scripts/package-release.ps1 -Runtime $env:RUNTIME -Version $env:VERSION
      - name: Publish and package on POSIX
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          bash scripts/publish.sh --version "$VERSION" "$RUNTIME"
          bash scripts/package-release.sh --version "$VERSION" "$RUNTIME"
      - name: Smoke test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke.ps1 -PublishDirectory "artifacts/publish/${{ matrix.runtime }}"
      - name: Smoke test on POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/smoke.sh "artifacts/publish/${{ matrix.runtime }}"
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.runtime }}
          path: artifacts/release/*
          if-no-files-found: error

  assemble:
    needs: [resolve, publish]
    if: needs.resolve.outputs.hasRelease == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: artifacts/release
          merge-multiple: true
      - name: Add installers and checksums
        shell: bash
        run: |
          cp scripts/install.ps1 artifacts/release/install.ps1
          cp scripts/install.sh artifacts/release/install.sh
          cd artifacts/release
          sha256sum token-dashboard-* install.ps1 install.sh > SHA256SUMS
      - name: Upload assembled release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assembled
          path: artifacts/release
          if-no-files-found: error

  release:
    needs: [resolve, assemble]
    if: needs.resolve.outputs.hasRelease == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
      - name: Install release dependencies
        run: pnpm install --frozen-lockfile
      - name: Download assembled release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assembled
          path: artifacts/release
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release
