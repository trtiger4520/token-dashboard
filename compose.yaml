services:
  gateway:
    image: nginx:alpine
    ports:
      - "127.0.0.1:${TOKEN_DASHBOARD_PORT:-18080}:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5099/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  dashboard:
    build:
      context: .
    network_mode: "service:gateway"
    depends_on:
      gateway:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      TokenDashboard__BrowserHost: 127.0.0.1
      TokenDashboard__BrowserPort: ${TOKEN_DASHBOARD_PORT:-18080}
      TokenDashboard__ConnectionString: Data Source=/data/token-dashboard.db
      TokenDashboard__EmitStartupDiagnostics: "true"
      TokenDashboard__ListenPort: 5099
      TokenDashboard__OpenBrowser: "false"
    volumes:
      - dashboard-data:/data
      - ./tests/fixtures/private:/sources:ro
    read_only: true
    tmpfs:
      - /tmp

volumes:
  dashboard-data:
